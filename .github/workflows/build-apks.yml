name: build-apks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install platform and build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Fetch ecj + debug keystore
        run: ./tools/fetch-deps.sh

      - name: Build all five APKs
        run: ./build.sh

      - name: Collect
        run: |
          mkdir -p artifacts
          cp dist/*.apk artifacts/
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: artifacts/*.apk

      - name: Attach APKs to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
